<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .copied {
            animation: flash 1s;
        }
        @keyframes flash {
            0% { background-color: #10B981; }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <h1 class="text-4xl font-bold text-center mb-8 text-gray-800">URL Shortener</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6">
            <form id="urlForm" class="space-y-4">
                <div>
                    <label for="url" class="block text-sm font-medium text-gray-700">Enter URL to shorten</label>
                    <input type="url" id="url" required
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                           placeholder="https://example.com">
                </div>
                <button type="submit"
                        class="w-full bg-indigo-600 text-white rounded-md py-2 px-4 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Shorten URL
                </button>
            </form>

            <div id="result" class="mt-6 hidden">
                <div class="border rounded-md p-4 bg-gray-50">
                    <h2 class="text-sm font-medium text-gray-700 mb-2">Shortened URL</h2>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="shortUrl" readonly
                               class="block w-full rounded-md border-gray-300 bg-white shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <button onclick="copyToClipboard()"
                                class="bg-indigo-600 text-white rounded-md py-2 px-4 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                            Copy
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_SHORTEN_URL = '{{HOST_DOMAIN}}{{BACKEND_API_SHORTEN_URL}}';
        const form = document.getElementById('urlForm');
        const result = document.getElementById('result');
        const shortUrlInput = document.getElementById('shortUrl');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('url').value;

            try {
                const response = await fetch(API_SHORTEN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url }),
                });

                if (!response.ok) {
                    throw new Error('Failed to shorten URL');
                }

                const data = await response.json();
                const shortUrl = `${window.location.origin}/${data.short_url}`;
                shortUrlInput.value = shortUrl;
                result.classList.remove('hidden');
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        async function copyToClipboard() {
            try {
                await navigator.clipboard.writeText(shortUrlInput.value);
                const copyButton = shortUrlInput.nextElementSibling;
                copyButton.textContent = 'Copied!';
                copyButton.classList.add('bg-green-600');
                setTimeout(() => {
                    copyButton.textContent = 'Copy';
                    copyButton.classList.remove('bg-green-600');
                }, 1000);
            } catch (err) {
                alert('Failed to copy URL');
            }
        }
    </script>
</body>
</html>
