
services:
  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/dockerfile.dev
    env_file:
      - .env.dev # second because it overrides the first
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./backend:/app
    depends_on:
      - redis